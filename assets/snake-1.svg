<svg width="1000" height="20" viewBox="0 0 1000 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="-100" y="9" width="100" height="2" fill="#ff0000" filter="url(#glow)">
    <animate attributeName="x" values="-100;1000;1000;1000;1000;1000;1000;1000;-100" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;0;0;0;0;0;0;1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="12s" repeatCount="indefinite" />
  </rect>
</svg>
